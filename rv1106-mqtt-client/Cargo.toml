[workspace]
resolver = "2"
members = ["crates/mqtt-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
myrtio-mqtt = { path = "../myrtio-mqtt" }
embassy-time = { version = "0.5", features = ["std"] }
embassy-sync = "0.7.2"
embassy-futures = "0.1.2"
# critical-section 的 std 实现：提供 _critical_section_1_0_* 符号（embassy-sync 依赖）。
critical-section = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tungstenite = "0.26"
log = "0.4"
env_logger = "0.11"
