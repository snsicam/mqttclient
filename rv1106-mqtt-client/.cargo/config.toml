# RV1106 交叉编译配置（Luckfox Pico / Rockchip 830，uclibc 工具链）
#
# 目标概要：
#   - 芯片：Rockchip RV1106 (armv7l, hard-float, Cortex-A7)
#   - 根文件系统：uclibc（Luckfox 官方镜像 rootfs_uclibc_rv1106）
#   - 工具链：arm-rockchip830-linux-uclibcgnueabihf（Luckfox 提供）
#
# Rust 官方无 armv7-*-uclibceabihf target，采用标准 target
# `armv7-unknown-linux-gnueabihf` + Rockchip uclibc 工具链作为 linker，
# 由 uclibc 的 gcc 提供正确的 CRT / libc 链接与 sysroot。
#
# 由于板子 rootfs 是 uclibc，**必须**用 uclibc 工具链（gnu/glibc 产物依赖
# libc.so.6 + ld-linux-armhf.so.3，在 uclibc 板子上无法运行）。
# uclibc libc 缺失的符号由 cross/ 下的桩库补齐：
#   - libgetauxval.a  ：getauxval（Rust std 栈溢出保护 / ring 需要）
#   - libposix_spawn.a：posix_spawn_file_actions_{init,destroy} 与
#                       posix_spawnattr_*（这些函数在 uclibc 头文件里仅为
#                       static inline，Rust 需要外部符号）
#
# sysroot 与桩库的链接参数由 crates/mqtt-client/build.rs 的 cross_link_args() 生成：
#   - sysroot 跟随 RV1106_TOOLCHAIN 环境变量（与 scripts/build.sh 同一变量），
#     缺省 /opt/toolchain/arm-rockchip830-linux-uclibcgnueabihf；
#   - 桩库经 CARGO_MANIFEST_DIR 定位 workspace 的 cross/，无机器特定绝对路径。
# 此处只保留与工具链无关的 rustflags。

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-rockchip830-linux-uclibcgnueabihf-gcc"
rustflags = [
  "-C", "linker-flavor=gcc",
  "-C", "target-cpu=cortex-a7",
]
