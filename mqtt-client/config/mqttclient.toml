# RV1106 MQTT 客户端配置（对应 LLD-003 §9）

[device]
# 设备 ID：G + 序列号。序列号由板载序列号（/proc/cpuinfo Serial）前后各 8 位 u32 相加得 num，
# 拼前缀 "10" 并补零到 10 位（共 12 位数字，如 G102732598375，构成 topic：GT/MXS/UP/{id}）。
# 若保持占位值 G100000000000，启动时自动用板载序列号生成并回写。
id = "G100000000000"
# 主板型号版本
mb = "MOTHERBOARD_V1.0"
# MCU 软件版本
sf1 = "V1.0.0"
# ESP 软件版本
sf2 = "V1.0.0"
# WIFI 名称（login 上报）
wf = "PRINTER_WIFI"
# 语言：0 中文 / 1 非中文
lang = 0

[mqtt]
# 设备型号：构成 topic GT/{model}/UP|DOWN|LWT/{deviceId}（默认 M1S）
model = "M1S"
broker = "124.221.175.240"
port = 1883
# 心跳（秒），MXS 协议要求 60
keepalive_secs = 60
# Clean Session=0：保持会话，重连后可收到离线 QoS1 消息
clean_session = false
# 认证（可选）
# username 默认 = 设备 id（G+12 位数字序列号，动态生成）；如需固定账号可显式覆盖：
# username = "G102732598375"
# password = "secret"

[moonraker]
# 本机 Klipper 配套 API 服务器
host = "127.0.0.1"
port = 7125

[download]
# U 盘挂载目录
dir = "/mnt/udisk"
# 最大下载字节（默认 512MB）
max_file_bytes = 536870912
# 下载分块缓冲
chunk_size = 65536

[uds]
# UI 控制通道（Unix domain socket）：klipper_screen 经此下发云侧操作（下载/解绑/文件列表/gcode）。
enabled = true
# 监听路径；父目录会被自动创建，启动时会清理残留 socket 文件。
socket_path = "/run/mqttclient/ui.sock"

[blufi]
# 蓝牙配网（BluFi）相关配置
enabled = true
# WiFi 列表单帧上限（字节）。0=全量列表+自动 BluFi 分片（需 App 支持分片重组）；
# >0=单帧发送，按 RSSI 强度截断保留最强热点。当前 App 不支持 BluFi 分片
# （收到 FRAGMENTED 帧会 StopNotify 断连），必须用单帧模式。
scan_single_frame_bytes = 255
ack_repeat = 3
ack_interval_ms = 500
scan_timeout_ms = 5000
connect_timeout_ms = 30000
security = "plain"
version_major = 1
version_minor = 0
adapter = "hci0"
advertise = true
